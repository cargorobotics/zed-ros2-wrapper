# ZED XOne GS fisheye stereo calibration config.
# Used by the `zed_stereo_calibration` binary.

# Camera serial numbers (left and right of the virtual stereo pair).
left_sn: 305932808
right_sn: 305481469

# Capture resolution mode (ZED SDK enum name).
# Supported: HD1200, HD1080, HD720, SVGA
resolution: HD1200

# Checkerboard target. Counts are inner edges (not squares).
# Defaults match https://github.com/opencv/opencv/blob/4.x/doc/pattern.png
checkerboard:
  h_edges: 9
  v_edges: 6
  square_size_mm: 23.5

# Minimum / maximum number of good checkerboard pairs to collect in live mode.
# `min` is also the minimum for batch stereo calibration, live extrinsic preview, and early-finish ('f').
sample_collection:
  min: 12
  max: 35

# Optional: directory of pre-collected stereo image pairs (image_left_N.png / image_right_N.png).
# If set, the live capture step is skipped and stereo extrinsics are solved directly
# from these images using the factory fisheye intrinsics. Leave empty for live capture.
images_dir: ""

# Verbose calibration logs (enabled by default).
verbose: true
